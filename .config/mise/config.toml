# A constraint, not a version: `mise upgrade` moves inside it,
# `mise upgrade --bump` moves it and REWRITES this file.
# Majors pinned so a break is chosen, never received.
[tools]
neovim = "0.12"
node = "lts"
python = "3.14"
pipx = "latest"
rust = "1"
tree-sitter = "latest"
usage = "latest"       # required by `mise completion` (bash/zsh)

shellcheck = "0.11"
shfmt = "3.13"  # zsh support; upstream calls it incomplete, so zsh diffs get
                # READ, never applied blindly
yamllint = "1"
