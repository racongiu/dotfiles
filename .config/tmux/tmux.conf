# --- Terminal ---
set -g default-terminal "tmux-256color"

set -as terminal-features ",*:RGB"
# Undercurl (wavy underline) for (neo)vim diagnostics
set -as terminal-features ",*:usstyle"
# --- Prefix ---
set -g prefix C-Space
unbind C-b
# Every binding below carries a -N note. `prefix ?` runs `list-keys -N`, which
# prints ONLY noted bindings: without one, a key is absent from the built-in
# help while tmux's own defaults are all listed. Measured.
bind -N "Send the prefix key" C-Space send-prefix
bind -N "Reload tmux.conf" r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# --- Theme ---
# TERM_THEME=light|dark forces it. A mute script changes nothing and the
# DEFAULT stays dark: a pale bar on a dark background is unreadable.
# Loaded once here, re-checked by the status line -- see status-right.
run-shell '~/.config/scripts/theme/tmux.sh'

# --- Options ---
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
# 10 ms: the upstream default since 3.5, and a known remedy to flaky M-
# bindings at 0 (tmux-sensible#41). Not an ssh guard: tmux extends the
# timeout on its own while a terminal query is waiting for its reply.
set -s escape-time 10
set -g focus-events on        # autoread (neo)vim + vim-tmux-navigator
# Scrollback is RAM, allocated per pane: 1M was a ceiling nobody scrolls.
set -g history-limit 100000
set -g mouse on
set -g mode-keys vi
set -g set-clipboard on
set -g detach-on-destroy off
set -g status-interval 3
# 1 s is short to read a pane number and type it.
set -g display-panes-time 2000

# Exists since tmux 3.3, and every machine this config targets ships >= 3.3:
# set it directly. It gates the `tmux;` wrapper only, NOT Sixel: upstream
# parses a Sixel DCS before it ever reads this option (input_dcs_dispatch in
# input.c). Turning it off would close nothing there, only the version floor
# in docs/security.md does.
set -g allow-passthrough on

# --- Splits / New window ---
unbind %
unbind '"'
bind -N "Split side by side, same directory" b split-window -h -c "#{pane_current_path}"
bind -N "Split top and bottom, same directory" v split-window -v -c "#{pane_current_path}"
bind -N "New window, same directory" c new-window -c "#{pane_current_path}"

# --- Windows ---
# `l` is resize-left below, which took last-window with it: Tab gets it back.
# Pane side, `;` already does last-pane and is untouched.
bind -N "Back to the previous window" Tab last-window
# next/previous-window are NOT repeatable by default. Measured.
bind -r -N "Next window" n next-window
bind -r -N "Previous window" p previous-window
# `!` sends a pane out to its own window; nothing did the reverse.
bind -N "Pull a window back in as a pane" @ choose-window "join-pane -h -s '%%'"

# --- Resize panes ---
bind -r -N "Resize the pane down 5" j resize-pane -D 5
bind -r -N "Resize the pane up 5" k resize-pane -U 5
bind -r -N "Resize the pane right 5" l resize-pane -R 5
bind -r -N "Resize the pane left 5" h resize-pane -L 5
# `m` zoomed here, which `z` already does, and it cost select-pane -m -- the
# mark that join-pane and swap-pane work from. Written out rather than simply
# dropped: `source-file` never restores a binding, only a server restart does.
bind -N "Mark the pane, for join-pane and swap-pane" m select-pane -m

# --- Copy mode (vi) ---
bind-key -T copy-mode-vi 'v'   send -X begin-selection
bind-key -T copy-mode-vi 'V'   send -X select-line
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle
bind-key -T copy-mode-vi Escape send -X clear-selection

# Every helper is PROBED with `command -v`: picking from $WAYLAND_DISPLAY alone
# would run a missing binary on a machine without wl-clipboard and lose every
# copy silently. The list of helpers and the OSC 52 fallback: README.md here.
set -g @copy_cmd ""
if-shell 'command -v pbcopy >/dev/null 2>&1' \
  'set -g @copy_cmd "pbcopy"'
if-shell '[ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null 2>&1' \
  'set -g @copy_cmd "wl-copy"'
if-shell '[ -z "$WAYLAND_DISPLAY" ] && command -v xclip >/dev/null 2>&1' \
  'set -g @copy_cmd "xclip -selection clipboard"'

# copy-pipe-and-cancel with an EMPTY command copies nothing, so without a
# helper bind the plain selection and let OSC 52 carry the text. The condition
# below is EXACTLY the union of the three above: written any other way the
# bindings and @copy_cmd end up disagreeing and the copy is lost.
if-shell 'command -v pbcopy >/dev/null 2>&1 \
  || { [ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null 2>&1; } \
  || { [ -z "$WAYLAND_DISPLAY" ] && command -v xclip >/dev/null 2>&1; }' \
  'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "#{@copy_cmd}" ; \
   bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "#{@copy_cmd}"' \
  'bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel ; \
   bind -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel'

bind -N "Paste the tmux buffer" P paste-buffer
unbind -T copy-mode-vi MouseDragEnd1Pane

# --- Swap windows ---
bind -r -N "Move the window left" S-Left  run 'tmux swap-window -d -t #{e|-|:#I,1}'
bind -r -N "Move the window right" S-Right run 'tmux swap-window -d -t #{e|+|:#I,1}'

# --- Plugins ---
# Unpinned on purpose, argued in docs/architecture.md.
set -g @plugin 'tmux-plugins/tpm'
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'hendrikmi/tmux-cpu-mem-monitor'

# --- Resurrect ---
# Explicit rather than implicit: the plugin already defaults to XDG, EXCEPT
# when ~/.tmux/resurrect exists from an older setup, where it goes back there
# (helpers.sh:1-5). The plugin creates the directory and expands ~ itself.
set -g @resurrect-dir '~/.local/share/tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# --- Continuum ---
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# --- Status right ---
# The `#()` prints nothing: it is the periodic hook, tmux having no timer of
# its own. It lives HERE and not in a theme file, which is what keeps it from
# being wiped the moment one is re-sourced.
set -g status-right " #{cpu}   #{mem}  󱛟 #{disk -f}#(~/.config/scripts/theme/tmux.sh)"


# --- TPM (keep at bottom) ---
run '~/.config/tmux/plugins/tpm/tpm'
